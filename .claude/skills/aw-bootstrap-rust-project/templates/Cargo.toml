# Workspace root. One crate per bounded context under crates/ (rules/09-module-boundaries.md).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"   # MSRV; document the bump policy in the README
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"   # "deny" only for a crate with audited blocks
missing_docs = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
cognitive_complexity = "warn"
too_many_lines = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
module_name_repetitions = "allow"

# Each member crate's Cargo.toml:
#   [package]
#   name = "<context>"
#   version = "0.1.0"
#   edition.workspace = true
#   rust-version.workspace = true
#   [lints]
#   workspace = true
