workflow:
  name: aw-pipeline
  version: "1.0.0"
  description: "Autonomous agent-workflow implement-to-PR pipeline with test bounce-back and circuit breaker"
  entry_point: implement
  limits:
    max_iterations: 50
  input:
    change_id:
      type: string
      description: "OpenSpec change ID to process"
      required: true

agents:
  # ==========================================
  # STAGE 1: IMPLEMENT
  # ==========================================
  - name: implement
    type: script
    description: "Run /aw-implement agent"
    command: scripts/aw-agent-exec.sh
    args:
      - implement
      - "Run /aw-implement {{ workflow.input.change_id }}"
      - "{{ workflow.input.change_id }}"
    routes:
      - to: validate_implementation

  - name: validate_implementation
    type: script
    description: "Validate implementation handoff"
    command: python3
    args:
      - scripts/aw-handoff.py
      - check
      - --handoff
      - "openspec/changes/{{ workflow.input.change_id }}/aw-handoff.md"
      - --stage
      - implement
    routes:
      - to: run_tests
        when: "exit_code == 0"
      - to: implement
        when: "exit_code != 0"

  # ==========================================
  # STAGE 2: TEST (DETERMINISTIC)
  # ==========================================
  - name: run_tests
    type: script
    description: "Run deterministic tests"
    command: just
    args:
      - test
    routes:
      - to: test_success_handoff
        when: "exit_code == 0"
      - to: test_failure_handoff
        when: "exit_code != 0"

  - name: test_success_handoff
    type: script
    description: "Update handoff for test passed"
    command: python3
    args:
      - scripts/aw-handoff.py
      - update
      - --handoff
      - "openspec/changes/{{ workflow.input.change_id }}/aw-handoff.md"
      - --stage
      - test_passed
    routes:
      - to: ship_review

  - name: test_failure_handoff
    type: script
    description: "Record test failure and evaluate circuit breaker"
    command: python3
    args:
      - scripts/aw-handoff.py
      - update
      - --handoff
      - "openspec/changes/{{ workflow.input.change_id }}/aw-handoff.md"
      - --stage
      - test_failed
      - --stderr
      - "{{ run_tests.output.stderr }}"
    routes:
      - to: escalate_human_gate
        when: "retry_count > 6"
      - to: implement
        when: "retry_count <= 6"

  - name: escalate_human_gate
    type: human_gate
    prompt: "Test failures exceeded 6 attempts for change {{ workflow.input.change_id }}. Choose action:"
    options:
      - label: "Retry implementation"
        value: retry
        route: implement
      - label: "Abort workflow"
        value: abort
        route: terminate_failure

  # ==========================================
  # STAGE 3: SHIP REVIEW
  # ==========================================
  - name: ship_review
    type: script
    description: "Run /aw-ship-review agent"
    command: scripts/aw-agent-exec.sh
    args:
      - ship-review
      - "Run /aw-ship-review {{ workflow.input.change_id }}"
      - "{{ workflow.input.change_id }}"
    routes:
      - to: validate_review

  - name: validate_review
    type: script
    description: "Validate review scorecard"
    command: python3
    args:
      - scripts/aw-handoff.py
      - check-review
      - --handoff
      - "openspec/changes/{{ workflow.input.change_id }}/aw-handoff.md"
    routes:
      - to: pr_approval_gate
        when: "status == 'READY' and blockers == 0"
      - to: review_failure_handoff
        when: "status != 'READY' or blockers > 0"

  - name: review_failure_handoff
    type: script
    description: "Record review bounce-back"
    command: python3
    args:
      - scripts/aw-handoff.py
      - update
      - --handoff
      - "openspec/changes/{{ workflow.input.change_id }}/aw-handoff.md"
      - --stage
      - review_failed
    routes:
      - to: implement

  - name: pr_approval_gate
    type: human_gate
    prompt: "Review is READY with 0 blockers for change {{ workflow.input.change_id }}. Approve creating and opening PR?"
    options:
      - label: "Approve & Open PR"
        value: approve
        route: pr
      - label: "Reject & Revise"
        value: reject
        route: implement

  # ==========================================
  # STAGE 4: PR
  # ==========================================
  - name: pr
    type: script
    description: "Run /aw-pr agent"
    command: scripts/aw-agent-exec.sh
    args:
      - pr
      - "Run /aw-pr {{ workflow.input.change_id }}"
      - "{{ workflow.input.change_id }}"
    routes:
      - to: terminate_success

  # ==========================================
  # TERMINATIONS
  # ==========================================
  - name: terminate_success
    type: terminate
    status: success
    reason: "Pipeline completed successfully"

  - name: terminate_failure
    type: terminate
    status: failed
    reason: "Pipeline aborted by human gate"
